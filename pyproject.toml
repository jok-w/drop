[project]
name = "single-target-tracking"
version = "0.2.0"
description = "Single inert-object tracking and Jetson performance experiments"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.24,<2",
    "opencv-python==4.11.0.86",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "ultralytics==8.4.158",
]

[project.optional-dependencies]
export = ["onnx>=1.17,<1.18", "onnxruntime>=1.20,<1.23", "onnxslim>=0.1.82,<0.2"]

[tool.uv]
exclude-dependencies = ["tensorrt"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = [
    { index = "jetson-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
torchvision = [
    { index = "jetson-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]

[[tool.uv.index]]
name = "jetson-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
